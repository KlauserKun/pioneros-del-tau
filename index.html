<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Pioneros del Tau — Hasta pronto, familia</title>
<meta name="description" content="Una galaxia con el símbolo de Tau al centro y mensajes para los Pioneros del Tau, mi familia en Warframe.">
<link id="favicon" rel="icon" href="assets/tau-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html, body { margin:0; height:100%; background:#05060a; overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  /* Fondo: imagen cyber con viñeta para que el texto se lea bien */
  #bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:url('assets/cyber.jpg') center/cover no-repeat;
    filter:brightness(.72) saturate(1.08);
    transform:scale(1.05);transform-origin:center;
  }
  #bg::after{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 45%,rgba(3,6,14,.08),rgba(3,6,14,.72) 72%);
  }
  canvas { position:fixed;inset:0;z-index:1;display:block; }

  #main-title{
    position:fixed;top:34px;left:0;right:0;width:100%;
    font-size:2.5em;color:#FFF1C9;white-space:nowrap;
    text-shadow:0 0 10px #FFB347,0 0 20px #E8862A,0 0 34px rgba(232,134,42,.55);
    z-index:10;pointer-events:none;text-align:center;
    font-family:'Indie Flower','Bradley Hand','Segoe Script',cursive;
  }
  #sub-title{
    position:fixed;top:calc(34px + 3.05em);left:0;right:0;width:100%;
    font-size:1.25em;color:#FFD98A;white-space:nowrap;
    text-shadow:0 0 8px #E8862A,0 0 16px rgba(232,134,42,.5);
    z-index:10;pointer-events:none;text-align:center;
    font-family:'Indie Flower','Bradley Hand','Segoe Script',cursive;
    opacity:.95;
  }
  @media (max-width:768px){
    #main-title{font-size:1.6em;top:18px;white-space:normal;padding:0 10px;line-height:1.12;}
    #sub-title{top:calc(18px + 2.35em);font-size:.95em;}
  }

  #start-screen{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(4,7,14,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    display:flex;justify-content:center;align-items:center;
    flex-direction:column;color:#fff;z-index:9999;padding:20px;cursor:pointer;
    transition:opacity .7s ease,visibility .7s ease;
  }
  #start-screen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #start-emblem-wrap{
    position:relative;display:grid;place-items:center;
    width:clamp(160px,36vmin,280px);aspect-ratio:1/1;
  }
  #start-emblem-wrap::before{
    content:'';position:absolute;inset:-22%;border-radius:50%;
    background:radial-gradient(circle,rgba(160,220,255,.42),rgba(90,160,255,.16) 45%,transparent 70%);
    filter:blur(8px);animation:parpadeo 3s ease-in-out infinite;
  }
  #start-emblem{
    position:relative;width:100%;height:100%;object-fit:contain;display:block;
    animation:latido 2.4s ease-in-out infinite;transform-origin:50% 50%;
  }
  @keyframes latido{
    0%,100%{transform:scale(1) rotate(0deg);}
    50%{transform:scale(1.06) rotate(1.5deg);}
  }
  #start-text{
    font-size:1.8em;color:#FFE6A8;font-family:'Indie Flower','Bradley Hand','Segoe Script',cursive;
    text-shadow:0 0 7px #E8862A;text-align:center;
    margin-top:clamp(16px,3.5vh,28px);
    animation:parpadeo 2.2s ease-in-out infinite;
  }
  @keyframes parpadeo{0%,100%{opacity:.55;}50%{opacity:1;}}
  @media (prefers-reduced-motion:reduce){
    #start-emblem,#start-text{animation:none;}
  }
</style>
</head>

<div id="bg" aria-hidden="true"></div>
<canvas id="c"></canvas>

  <div id="start-text">Toca para iniciar</div>
</div>

  "⚜️ Donde quiera que vaya, llevo el Tau conmigo",

  "🌌 Gracias por tanto, familia. Hasta pronto 💛"
];

// Dibuja el símbolo de Tau (estilo Sentient) en un canvas reutilizable.
function makeEmblemCanvas(size){
  size = size || 720;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const cx = size/2, cy = size/2, R = size*0.40;

  // Resplandor de fondo
  const glow = g.createRadialGradient(cx,cy,size*0.02,cx,cy,size*0.5);
  glow.addColorStop(0,'rgba(255,220,140,0.42)');
  glow.addColorStop(0.35,'rgba(255,150,60,0.16)');
  glow.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = glow;
  g.fillRect(0,0,size,size);

  const gold = g.createLinearGradient(cx-R,cy-R,cx+R,cy+R);
  gold.addColorStop(0,'#fff3c4');
  gold.addColorStop(0.5,'#ffc766');
  gold.addColorStop(1,'#e8862a');

  g.save();
  g.translate(cx,cy);
  g.strokeStyle = gold;
  g.lineCap = 'round';
  g.lineJoin = 'round';

  // Aros exteriores
  g.lineWidth = size*0.010;
  g.globalAlpha = 0.95;
  g.beginPath(); g.arc(0,0,R,0,Math.PI*2); g.stroke();
  g.lineWidth = size*0.006;
  g.globalAlpha = 0.55;
  g.beginPath(); g.arc(0,0,R*1.13,0,Math.PI*2); g.stroke();

  // Marcas del aro
  g.lineWidth = size*0.008;
  g.globalAlpha = 0.9;
  for (let i=0;i<48;i++){
    const a = i/48*Math.PI*2;
    const r1 = R*1.045;
    const r2 = R*(i%4===0 ? 1.18 : 1.10);
    g.beginPath();
    g.moveTo(Math.cos(a)*r1, Math.sin(a)*r1);
    g.lineTo(Math.cos(a)*r2, Math.sin(a)*r2);
    g.stroke();
  }

  // Aspas / cuchillas Sentient
  g.globalAlpha = 1;
  for (let k=0;k<4;k++){
    g.save();
    g.rotate(k*Math.PI/2 + Math.PI/4);
    g.strokeStyle = gold;
    g.lineWidth = size*0.014;
    g.beginPath();
    g.moveTo(R*0.64, 0);
    g.quadraticCurveTo(R*0.96, -R*0.24, R*1.16, 0);
    g.stroke();
    g.fillStyle = '#ffe6a8';
    g.beginPath(); g.arc(R*1.16, 0, size*0.012, 0, Math.PI*2); g.fill();
    g.restore();
  }

  // Hexágono interior
  g.strokeStyle = gold;
  g.lineWidth = size*0.008;
  g.globalAlpha = 0.75;
  g.beginPath();
  for (let i=0;i<6;i++){
    const a = Math.PI/6 + i*Math.PI/3;
    const x = Math.cos(a)*R*0.70, y = Math.sin(a)*R*0.70;
    if (i===0) g.moveTo(x,y); else g.lineTo(x,y);
  }
  g.closePath(); g.stroke();

  // Glifo Tau (τ)
  g.globalAlpha = 1;
  g.strokeStyle = gold;
  g.lineWidth = size*0.052;
  g.beginPath(); g.moveTo(-R*0.40,-R*0.24); g.lineTo(R*0.40,-R*0.24); g.stroke();
  g.beginPath(); g.moveTo(0,-R*0.24); g.lineTo(0,R*0.40); g.stroke();
  g.lineWidth = size*0.044;
  g.beginPath(); g.moveTo(-R*0.26,R*0.45); g.quadraticCurveTo(0,R*0.63,R*0.26,R*0.45); g.stroke();

  g.restore();
  return c;
}

// Emblema generado: queda como respaldo si el logo real no carga.
const emblemCanvas = makeEmblemCanvas(720);

// Logo incrustado: garantiza que WebGL lo use incluso abriendo el archivo
// localmente (file://), donde las texturas desde archivos suelen bloquearse.
document.getElementById('start-emblem').src = LOGO_DATA;
document.getElementById('favicon').href = LOGO_DATA;

<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setClearColor(0x000000,0);
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,5000);
let targetDist=300,currentDist=300,rotX=0.2,rotY=0;

(function makeStars(count=2200,spread=3000){
  const g=new THREE.BufferGeometry();
  const pos=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r=spread*(0.3+Math.random()*0.7);
    const th=Math.random()*Math.PI*2;
    const ph=Math.acos(2*Math.random()-1);
    pos[i*3+0]=r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1]=r*Math.cos(ph);
    pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
  }
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.5,color:0xffffff,depthWrite:false})));
})();

// Centro: solo el emblema (sin agujero negro ni resplandor detrás).

// Emblema central 3D (siempre mirando a la cámara).
// Carga el logo real; si falla, usa el símbolo de Tau generado como respaldo.
const EMBLEM_W=132;
let emblemAspect=512/485;
const emblemMat=new THREE.SpriteMaterial({
  map:new THREE.CanvasTexture(emblemCanvas),
  transparent:true,depthWrite:false,depthTest:false,
  blending:THREE.NormalBlending
});
const emblemSprite=new THREE.Sprite(emblemMat);
emblemSprite.position.set(0,0,2);
function fitEmblem(){
  emblemSprite.scale.set(EMBLEM_W,EMBLEM_W/emblemAspect,1);
}
fitEmblem();
scene.add(emblemSprite);
new THREE.TextureLoader().load(LOGO_DATA,(tex)=>{
  tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const img=tex.image||{};
  if(img.width&&img.height) emblemAspect=img.width/img.height;
  emblemMat.map=tex;
  emblemMat.needsUpdate=true;
  fitEmblem();
},undefined,()=>{/* respaldo: queda el emblema generado */});

// Anillos cibernéticos (HUD): arcos segmentados, marcas de radar y bloques de datos.
function cyberRingTexture(size,innerFrac,outerFrac){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');g.translate(size/2,size/2);
  const R=size/2;
  const CY='#8fe9ff',BL='#4aa8ff',MG='#ff5ad1',WH='#e6f9ff';
  g.globalCompositeOperation='lighter';g.lineCap='butt';
  function arc(r,a0,a1,w,color,alpha,glow){
    g.beginPath();g.arc(0,0,r,a0,a1);
    g.lineWidth=w;g.strokeStyle=color;g.globalAlpha=alpha;
    g.shadowColor=color;g.shadowBlur=glow;g.stroke();
  }
  const ri=size*0.5*innerFrac, ro=size*0.5*outerFrac;
  // guías tenues del aro
  arc(ri,0,Math.PI*2,size*0.0035,CY,0.20,size*0.012);
  arc(ro,0,Math.PI*2,size*0.0030,CY,0.16,size*0.012);
  // arcos segmentados en varias pistas
  const tracks=[0.14,0.38,0.62,0.85];
  for(let ti=0;ti<tracks.length;ti++){
    const r=ri+(ro-ri)*tracks[ti];
    const segs=8+ti*3;
    for(let i=0;i<segs;i++){
      const base=i/segs*Math.PI*2;
      const span=(Math.PI*2/segs)*(0.35+0.40*(((i*7+ti*3)%9)/8));
      const col=(i%7===0)?MG:((ti%2)?CY:BL);
      arc(r,base+0.04,base+0.04+span,size*(0.005+0.003*((i+ti)%3)/2),col,0.45+0.40*(((i*5+ti)%5)/4),size*0.014);
    }
  }
  // marcas radiales tipo radar
  const ticks=120;
  for(let i=0;i<ticks;i++){
    const a=i/ticks*Math.PI*2;
    const long=(i%10===0), mid=(i%5===0);
    const r1=ro*(long?0.90:(mid?0.95:0.975));
    const r2=ro*1.015;
    g.beginPath();g.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);g.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
    g.lineWidth=size*(long?0.006:(mid?0.004:0.0022));
    g.strokeStyle=long?WH:CY;
    g.globalAlpha=long?0.90:(mid?0.60:0.32);
    g.shadowColor=CY;g.shadowBlur=size*0.008;g.stroke();
  }
  // bloques de datos
  for(let i=0;i<30;i++){
    const a=((i*137.5)%360)*Math.PI/180;
    const rr=ri+(ro-ri)*(0.20+0.60*(((i*29)%11)/10));
    const w=size*(0.0035+0.004*((i*11)%4)/3);
    const len=size*(0.018+0.030*(((i*17)%7)/6));
    const col=(i%5===0)?MG:(i%2?CY:BL);
    g.save();g.rotate(a);
    g.beginPath();g.rect(rr,-w/2,len,w);
    g.fillStyle=col;g.globalAlpha=0.45+0.40*(((i*3)%5)/4);
    g.shadowColor=col;g.shadowBlur=size*0.012;g.fill();g.restore();
  }
  return new THREE.CanvasTexture(c);
}

// Aro exterior punteado con marcas cortas
function cyberDashedTexture(size,innerFrac,outerFrac){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');g.translate(size/2,size/2);
  const R=size/2, CY='#9ff0ff', MG='#ff5ad1';
  g.globalCompositeOperation='lighter';g.lineCap='butt';
  const r=R*(innerFrac+outerFrac)/2;
  g.setLineDash([size*0.020,size*0.014]);
  g.beginPath();g.arc(0,0,r,0,Math.PI*2);
  g.lineWidth=size*0.006;g.strokeStyle=CY;g.globalAlpha=0.80;
  g.shadowColor=CY;g.shadowBlur=size*0.012;g.stroke();
  g.setLineDash([]);
  for(let i=0;i<72;i++){
    const a=i/72*Math.PI*2;
    const long=(i%6===0);
    const r1=R*(long?innerFrac*1.02:(innerFrac+outerFrac)/2);
    const r2=R*outerFrac*0.99;
    g.beginPath();g.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);g.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
    g.lineWidth=size*(long?0.005:0.0025);
    g.strokeStyle=(i%18===0)?MG:CY;g.globalAlpha=long?0.85:0.40;
    g.shadowColor=g.strokeStyle;g.shadowBlur=size*0.008;g.stroke();
  }
  return new THREE.CanvasTexture(c);
}

const cyberTex=cyberRingTexture(1024,68/128,1.0);
const ring=new THREE.Mesh(new THREE.RingGeometry(68,128,192),new THREE.MeshBasicMaterial({map:cyberTex,transparent:true,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,opacity:1,depthWrite:false}));
ring.rotation.x=Math.PI/2;
scene.add(ring);

// Segundo aro inclinado (giroscopio) para dar profundidad
const ringB=new THREE.Mesh(new THREE.RingGeometry(68,128,192),new THREE.MeshBasicMaterial({map:cyberTex,transparent:true,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,opacity:0.45,depthWrite:false}));
ringB.rotation.x=Math.PI/2.9;
ringB.rotation.z=0.7;
ringB.scale.set(1.04,1.04,1.04);
scene.add(ringB);

const dashTex=cyberDashedTexture(1024,134/141,1.0);
const ring2=new THREE.Mesh(new THREE.RingGeometry(134,141,192),new THREE.MeshBasicMaterial({map:dashTex,transparent:true,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,opacity:0.9,depthWrite:false}));
ring2.rotation.x=Math.PI/2;
scene.add(ring2);

// Textos orbitales
const WORD_SLOTS=170;
const WORDS=Array.from({length:WORD_SLOTS},(_,i)=>FRASES[i%FRASES.length]);
function makeTextTexture(text,color){
  const c=document.createElement('canvas');c.width=640;c.height=140;
  const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#fff';ctx.shadowColor=color;ctx.shadowBlur=30;
  const maxWidth=c.width-48;
  let fontSize=58;
  ctx.font=fontSize+"px 'Indie Flower', cursive";
  while(ctx.measureText(text).width>maxWidth&&fontSize>22){
    fontSize-=2;
    ctx.font=fontSize+"px 'Indie Flower', cursive";
  }
  ctx.fillText(text,c.width/2,c.height/2);
  return new THREE.CanvasTexture(c);
}
const COLORS=['#ffd27a','#ffc766','#ffb347','#ffe6a8','#ff9a3c','#fff1c9','#f4c430','#e8b04a','#ffdc8a','#f0c060'];
const textGroup=new THREE.Group();scene.add(textGroup);
document.fonts.load("40px 'Indie Flower'").catch(()=>{}).then(()=>{
  for(let i=0;i<WORDS.length;i++){
    const tex=makeTextTexture(WORDS[i],COLORS[i%COLORS.length]);
    const mat=new THREE.SpriteMaterial({map:tex,transparent:true});
    const sp=new THREE.Sprite(mat);
    sp.scale.set(86,18.8,1);
    const phi=Math.acos(2*Math.random()-1);const theta=Math.random()*Math.PI*2;
    const r=155+Math.random()*125;
    sp.position.set(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));
    sp.userData={phi:phi,theta:theta,radius:r,speed:0.001+Math.random()*0.001};
    textGroup.add(sp);
  }
});

let dragging=false,lastX=0,lastY=0;
function onDown(e){dragging=true;const t=e.touches?e.touches[0]:e;lastX=t.clientX;lastY=t.clientY;}
function onMove(e){if(!dragging)return;const t=e.touches?e.touches[0]:e;const dx=(t.clientX-lastX)/innerWidth;const dy=(t.clientY-lastY)/innerHeight;rotY-=dx*5;rotX=Math.max(-1.2,Math.min(1.2,rotX+dy*3.5));lastX=t.clientX;lastY=t.clientY;}
function onUp(){dragging=false;}
addEventListener('mousedown',onDown);addEventListener('mousemove',onMove);addEventListener('mouseup',onUp);
addEventListener('touchstart',onDown,{passive:true});addEventListener('touchmove',onMove,{passive:true});addEventListener('touchend',onUp,{passive:true});
addEventListener('wheel',(e)=>{targetDist+=e.deltaY*0.25;targetDist=Math.max(160,Math.min(600,targetDist));},{passive:true});

let pinch=0;
addEventListener('touchmove',(e)=>{
  if(e.touches && e.touches.length===2){
    e.preventDefault();
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.hypot(dx,dy);
    if(pinch){targetDist+=(pinch-d)*0.5;targetDist=Math.max(160,Math.min(600,targetDist));}
    pinch=d;
  }
},{passive:false});
addEventListener('touchend',()=>{pinch=0;},{passive:true});

let t=0;
function tick(){requestAnimationFrame(tick);t+=0.01;
  ring.rotation.z+=0.003;
  ringB.rotation.z-=0.0019;
  ring2.rotation.z-=0.0016;
  emblemSprite.scale.set(EMBLEM_W,EMBLEM_W/emblemAspect,1);
  textGroup.children.forEach(sp=>{
    sp.material.opacity=0.8+0.2*Math.sin(t*2+sp.userData.radius);
    sp.userData.theta+=sp.userData.speed;
    sp.position.x=sp.userData.radius*Math.sin(sp.userData.phi)*Math.cos(sp.userData.theta);
    sp.position.z=sp.userData.radius*Math.sin(sp.userData.phi)*Math.sin(sp.userData.theta);
  });
  currentDist+=(targetDist-currentDist)*0.06;
  const cx=Math.cos(rotX),sx=Math.sin(rotX);const cy=Math.cos(rotY),sy=Math.sin(rotY);
  camera.position.set(currentDist*sy*cx,currentDist*sx,currentDist*cy*cx);camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
tick();

const startScreen=document.getElementById('start-screen');
const audio=document.getElementById('audio');
function startExperience(){
  startScreen.classList.add('hidden');
  setTimeout(()=>startScreen.style.display='none',800);
  audio.play().catch(()=>{});
}
startScreen.addEventListener('click',startExperience);
</script>
